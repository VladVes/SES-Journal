services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - DATABASE_URL=host=ses-journal-db user=ses-journal password=secret dbname=ses-journal-db port=5432 sslmode=disable
    depends_on:
      ses-journal-db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./:/app
      - /app/tmp
      - ./logs:/app/logs
    command: air -c .air.toml
    
  ses-journal-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ses-journal-db
      POSTGRES_USER: ses-journal
      POSTGRES_PASSWORD: secret 
    ports:
      - "5432:5432"
    volumes:
      - ses_journal_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ses-journal -d ses-journal-db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ses_journal_data:
    driver: local