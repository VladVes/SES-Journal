services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - DATABASE_URL="host=localhost user=ses-journal password=secret dbname=ses-journal-db port=5432 sslmode=disable"
    depends_on:
      - ses-journal-db
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    
  ses-journal-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ses-journal-db
      POSTGRES_USER: ses-journal
      POSTGRES_PASSWORD: secret 
    ports:
      -"5432:5432"
    volumes:
      -ses_journal_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ses_journal_data